name: Verify LightStage
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: lightstage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:original
      - run: npm run build
      - name: Verify committed install artifacts
        run: git diff --exit-code -- dist docs/DEPENDENCIES.json docs/THIRD-PARTY-NOTICES.txt
      - run: npm run pack:check
      - name: Test the public source archive for this commit
        if: github.event_name == 'push' && matrix.node == 24
        run: npm run public:check -- https://github.com/thakoreh/lightstage/archive/${{ github.sha }}.tar.gz
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 24
        with:
          name: lightstage-build
          path: |
            showcase/
            lightstage-react-*.tgz
          retention-days: 14
